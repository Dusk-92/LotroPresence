name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bridge:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64
        run: dotnet restore bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj --runtime win-x64

      - name: Publish Windows x64
        run: >-
          dotnet publish bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/LotroPresence

      - name: Include LOTRO plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/LotroPresence/plugin | Out-Null
          Copy-Item -Path plugin/Dusk -Destination publish/LotroPresence/plugin -Recurse -Force

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/LotroPresence/* -DestinationPath LotroPresence-win-x64.zip -Force

      - name: Publish development release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag LotroPresence-win-x64.zip --repo "${{ github.repository }}" --title "LotroPresence v0.1.0-alpha" --notes "Première version expérimentale de LotroPresence. Contient le bridge Windows x64 autonome et le plugin LOTRO." --prerelease
          } else {
            gh release upload $tag LotroPresence-win-x64.zip --repo "${{ github.repository }}" --clobber
          }
