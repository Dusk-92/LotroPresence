name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  bridge:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate source versions
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content -Raw "plugin/Dusk/LotroPresence.plugin")
          $manifestVersion = [string]$manifest.Plugin.Information.Version
          $lua = Get-Content -Raw "plugin/Dusk/LotroPresence/Main.lua"

          if ($lua -notmatch 'local VERSION = "([^"]+)";') {
            throw "Impossible de lire VERSION dans Main.lua."
          }

          $luaVersion = $Matches[1]
          if ($luaVersion -ne $manifestVersion) {
            throw "Versions incohérentes : Main.lua=$luaVersion, manifest=$manifestVersion."
          }

          Write-Host "Version source cohérente : $manifestVersion"

      - name: Restore Windows x64
        run: dotnet restore bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj --runtime win-x64 --use-lock-file

      - name: Show generated NuGet lock
        shell: pwsh
        run: Get-Content -Raw bridge/LotroPresence.Bridge/packages.lock.json

      - name: Publish Windows x64
        run: >-
          dotnet publish bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/LotroPresence

      - name: Run bridge self-tests
        shell: pwsh
        run: .\publish\LotroPresence\LotroPresence.exe --self-test

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: bridge
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate release tag and source versions
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content -Raw "plugin/Dusk/LotroPresence.plugin")
          $pluginVersion = [string]$manifest.Plugin.Information.Version
          $lua = Get-Content -Raw "plugin/Dusk/LotroPresence/Main.lua"

          if ($lua -notmatch 'local VERSION = "([^"]+)";') {
            throw "Impossible de lire VERSION dans Main.lua."
          }

          $luaVersion = $Matches[1]
          if ($luaVersion -ne $pluginVersion) {
            throw "Versions incohérentes : Main.lua=$luaVersion, manifest=$pluginVersion."
          }

          $tag = "${{ github.ref_name }}"
          $pattern = "^v" + [regex]::Escape($pluginVersion) + '($|-)'

          if ($tag -notmatch $pattern) {
            throw "Le tag $tag ne correspond pas à la version du plugin $pluginVersion."
          }

      - name: Restore Windows x64
        run: dotnet restore bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj --runtime win-x64 --use-lock-file

      - name: Publish Windows x64
        run: >-
          dotnet publish bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/LotroPresence

      - name: Run bridge self-tests
        shell: pwsh
        run: .\publish\LotroPresence\LotroPresence.exe --self-test

      - name: Include LOTRO plugin and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/LotroPresence/plugin | Out-Null
          Copy-Item -Path plugin/Dusk -Destination publish/LotroPresence/plugin -Recurse -Force
          Copy-Item -Path NOTICE.md -Destination publish/LotroPresence/NOTICE.md -Force
          Copy-Item -Path README.md -Destination publish/LotroPresence/README.md -Force

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/LotroPresence/* -DestinationPath LotroPresence-win-x64.zip -Force
          $hash = (Get-FileHash LotroPresence-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LotroPresence-win-x64.zip" | Set-Content -Path LotroPresence-win-x64.zip.sha256 -Encoding ascii

      - name: Publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existe déjà : elle reste immuable, aucun asset n'est remplacé."
            exit 0
          }

          $releaseArgs = @(
            "release", "create", $tag,
            "LotroPresence-win-x64.zip",
            "LotroPresence-win-x64.zip.sha256",
            "--repo", "${{ github.repository }}",
            "--verify-tag",
            "--title", "LotroPresence $tag",
            "--notes", "Build vérifié par CI. Inclut le bridge Windows x64 autonome, le plugin LOTRO, le README, le NOTICE et le checksum SHA-256."
          )

          if ($tag.Contains("-")) {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs
