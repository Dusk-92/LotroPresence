name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bridge:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64
        run: dotnet restore bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj --runtime win-x64

      - name: Publish Windows x64
        run: >-
          dotnet publish bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/LotroPresence

      - name: Include LOTRO plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/LotroPresence/plugin | Out-Null
          Copy-Item -Path plugin/Dusk -Destination publish/LotroPresence/plugin -Recurse -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LotroPresence-win-x64
          path: publish/LotroPresence/**
          if-no-files-found: error
          compression-level: 9
