name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lua-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate Lua syntax
        run: luac5.1 -p plugin/Dusk/LotroPresence/Main.lua

  bridge:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: lua-lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'

      - name: Build, audit, test and package
        shell: pwsh
        run: ./build/Build-LotroPresence.ps1






  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: lua-lint
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'

      - name: Build, audit, test and package exact tag
        shell: pwsh
        run: ./build/Build-LotroPresence.ps1 -ExpectedTag "${{ github.ref_name }}"

      - name: Publish non-overwriting release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existe déjà : aucun asset n'est remplacé."
            exit 0
          }

          $releaseArgs = @(
            "release", "create", $tag,
            "LotroPresence-win-x64.zip",
            "LotroPresence-win-x64.zip.sha256",
            "--repo", "${{ github.repository }}",
            "--verify-tag",
            "--title", "LotroPresence $tag",
            "--notes", "Build vérifié dans le même job que la publication : lint Lua 5.1, restore NuGet verrouillé, audit des vulnérabilités, tests de régression, compilation .NET 10 LTS, self-tests, smoke-test, validation du ZIP et du SHA-256."
          )

          if ($tag.Contains("-")) {
            $releaseArgs += "--prerelease"
          }

          gh @releaseArgs
