name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bridge:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64
        run: dotnet restore bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj --runtime win-x64

      - name: Publish Windows x64
        run: >-
          dotnet publish bridge/LotroPresence.Bridge/LotroPresence.Bridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/LotroPresence

      - name: Run bridge self-tests
        shell: pwsh
        run: .\publish\LotroPresence\LotroPresence.exe --self-test

      - name: Include LOTRO plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/LotroPresence/plugin | Out-Null
          Copy-Item -Path plugin/Dusk -Destination publish/LotroPresence/plugin -Recurse -Force

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/LotroPresence/* -DestinationPath LotroPresence-win-x64.zip -Force
          $hash = (Get-FileHash LotroPresence-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LotroPresence-win-x64.zip" | Set-Content -Path LotroPresence-win-x64.zip.sha256 -Encoding ascii

      - name: Publish immutable development release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.0-alpha"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existe déjà : elle reste immuable, aucun asset n'est remplacé."
            exit 0
          }

          gh release create $tag `
            LotroPresence-win-x64.zip `
            LotroPresence-win-x64.zip.sha256 `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "LotroPresence v0.4.0-alpha" `
            --notes "Durcissement : schéma versionné, instance unique, scan PluginData allégé, heartbeat allongé, auto-tests CI, support River Hobbit et checksum SHA-256." `
            --prerelease
