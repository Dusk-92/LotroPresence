name: One-time artifact cleanup

on:
  push:
    paths:
      - ".github/workflows/cleanup-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest artifact per name and delete older copies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          declare -A seen
          deleted=0
          kept=0

          while IFS=$'\t' read -r name created id; do
            [[ -z "$id" ]] && continue

            if [[ -z "${seen[$name]+x}" ]]; then
              seen["$name"]=1
              kept=$((kept + 1))
              echo "KEEP   $name  $created  id=$id"
            else
              echo "DELETE $name  $created  id=$id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.name, .created_at, (.id|tostring)] | @tsv' \
              | sort -t$'\t' -k1,1 -k2,2r
          )

          echo "Cleanup complete: kept=$kept deleted=$deleted"
